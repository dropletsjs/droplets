name: Release

# Changesets flow, in two jobs so that only the publish job can publish:
#
#   1. `version` (every push to main): while .changeset/*.md files exist it
#      opens or updates the "Version Packages" PR. It has no id-token and no
#      environment, so it cannot publish anything.
#   2. `publish`: runs only when the repository is public, no changesets are
#      pending AND npm answers E404 for at least one public package's version
#      (right after the Version PR merged). It publishes through npm trusted
#      publishing (OIDC): there is no NPM_TOKEN anywhere.
#
# While the repository is private, the publish job is skipped: its `if`
# requires `github.event.repository.private` to be false, so nothing can be
# published from here. 1.0.0 is published by hand. From 1.0.1 on, a trusted
# publisher on npm (bound to this workflow and the `npm-release` environment)
# plus the public repository let the publish job publish; required reviewers
# and `main` as the only deployment branch get switched on for `npm-release`
# then too (GitHub's Free plan has no protection rules for private ones).
#
# There is no pre mode: `changeset publish` publishes under the `latest`
# dist-tag. The guard step below refuses to publish if a .changeset/pre.json
# appears, so nothing goes out under a pre-release tag by accident.
#
# GitHub-hosted runners only: npm trusted publishing doesn't accept
# self-hosted runners. Triggers and runners: AGENTS.md rule 22, checked by
# tests/packages/test/workflows.test.ts. A failed run is re-run from the
# Actions page.

on:
  push:
    branches: [main]

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version PR / detect pending release
    if: github.repository == 'dropletsjs/droplets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open/update the Version Packages PR
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
      unpublished: ${{ steps.pending.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in release jobs: a poisoned cache must not reach them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # This job builds nothing (`changeset version` is plain JavaScript), so
      # no dependency gets to run an install script here.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No publish-script: this job only versions. changesets/action v2 pushes
      # through the GitHub API with the job token, so checkout needn't keep it.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: "Version Packages"
          pr-title: "Version Packages"
      - id: pending
        name: Any public package version not on npm yet?
        if: steps.changesets.outputs.has-changesets == 'false'
        # Only npm's E404 means "not published"; any other failure (the
        # network, the registry, auth) stops the job instead of guessing.
        run: |
          pnpm ls -r --depth -1 --json \
            | node -e 'for (const p of JSON.parse(require("fs").readFileSync(0, "utf8"))) if (!p.private && p.name && p.version) console.log(`${p.name}@${p.version}`)' \
            > "$RUNNER_TEMP/public-packages.txt"
          unpublished=false
          while read -r spec; do
            if out=$(npm view "$spec" version --json 2>/dev/null); then
              continue
            fi
            code=$(node -e 'try { console.log(JSON.parse(process.argv[1]).error?.code ?? "") } catch { console.log("") }' "$out")
            if [ "$code" = E404 ]; then
              echo "Not on npm yet: $spec"
              unpublished=true
            else
              echo "::error::npm view $spec failed with ${code:-no error code}, not E404: cannot tell whether it is published"
              exit 1
            fi
          done < "$RUNNER_TEMP/public-packages.txt"
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: version
    if: github.event.repository.private == false && needs.version.outputs.has-changesets == 'false' && needs.version.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: write # git tags + GitHub releases
      pull-requests: write # changesets/action comments on released PRs
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1 (dist-tag handling >= 11.21.0);
      # Node 22 ships npm 10. `pnpm publish` hands the tarball to this npm.
      - run: npm install -g npm@11.21.2
      - name: Refuse to publish with an npm older than 11.5.1
        run: |
          version=$(npm --version)
          node -e 'const [major, minor, patch] = process.argv[1].split(/[.-]/).map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)' "$version" \
            || { echo "::error::npm $version is older than 11.5.1, the first with trusted publishing"; exit 1; }
      - name: Refuse to publish in pre mode
        run: |
          test ! -f .changeset/pre.json || { echo "::error::.changeset/pre.json exists: pre mode is on, and releases publish under latest only"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # `pnpm release` = build + `changeset publish`.
          publish-script: pnpm release
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
