name: CI

# Hardening notes:
# - Triggers are `pull_request` and `push` to main only (AGENTS.md rule 22,
#   checked by tests/packages/test/workflows.test.ts). `pull_request_target`
#   and `workflow_run` run with the base repo's token and secrets in the
#   context of fork-controlled code.
# - RUNNERS: GitHub-hosted only (`ubuntu-latest`). A self-hosted runner must
#   NEVER be attached to this repository (or to an org runner group it can
#   use): once it is public, any fork PR could run arbitrary code on that
#   machine.
# - The token is read-only and checkout does not persist it. Only the two
#   deploy jobs reference secrets: they run on a push to main of
#   dropletsjs/droplets after every other job passed, in the `cloudflare`
#   environment (restricted to main), with no dependency cache, and the
#   Cloudflare credentials reach the deploy steps alone.
# - Every action is pinned to a full commit SHA; Dependabot bumps them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every push to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The Bun and Deno adapters' suites serve a build with the real runtime;
      # they are skipped where the binary is missing.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      # pnpm check runs tests/dev-mixed, which drives vite dev in Chromium.
      - run: pnpm --filter @dropletsjs/tests-dev-mixed exec playwright install --with-deps chromium
      - run: pnpm check
      # Builds and starts apps/demo (Node) on a local port, for the live
      # droplets the pages inline; the build fails without it.
      - run: pnpm docs:build
      # Every inline script Starlight writes has its hash in apps/docs/public/_headers.
      - run: pnpm docs:check-csp

  e2e:
    name: Browser (tests/examples)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The unit tests run in the check job's build.
      - run: pnpm build:dist
      - run: pnpm --filter @dropletsjs/tests-examples exec playwright install --with-deps chromium
      # Builds the eight framework examples, then runs one project per example.
      - run: pnpm test:e2e

  hosts:
    name: Hosts typecheck (examples/hosts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/hosts/*/package-lock.json
      # The hosts are outside the pnpm workspace: each one's npm ci, then its
      # npm run typecheck. A job of its own, since it installs five projects.
      - run: node tests/hosts/typecheck.mjs

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the droplets server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: examples/frameworks/Dockerfile
          push: false
          load: true
          tags: droplets-svelte:ci
          cache-from: type=gha
          # Only main writes the layer cache, so a PR can't seed it.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: Smoke test
        run: |
          docker run -d --rm --name droplets -p 8000:8000 droplets-svelte:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          for id in ssr-hydrate ssr-nohydrate; do
            # Frameworks may put hydration markers between text nodes.
            curl -sf "http://localhost:8000/droplets/$id?who=CI" | sed 's/<!--[^>]*-->//g' | grep -q "Hello CI!"
          done
          curl -sf -o /dev/null "http://localhost:8000/droplets/client/client.js"
          curl -sf -o /dev/null http://localhost:8000/index.js
          docker stop droplets

  deploy-demo:
    name: Deploy the demo (Cloudflare)
    needs: [check, e2e, hosts, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dropletsjs/droplets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    permissions:
      contents: read
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    outputs:
      build: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache in a job with secrets: a poisoned cache must not reach it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The unit tests ran in the check job's build.
      - run: pnpm build:dist
      # build:cloudflare, then wrangler deploy. DROPLETS_SECRET is already a
      # Worker secret, which a deploy keeps.
      - run: pnpm --filter @dropletsjs/demo deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The hash of the build just deployed, random per build: every fragment
      # answer of the demo names it in x-droplets-build.
      - id: build
        run: echo "hash=$(node -p 'require("./apps/demo/dist/client/droplets.json").__hash')" >> "$GITHUB_OUTPUT"

  deploy-docs:
    name: Deploy the docs (Cloudflare)
    # The pages inline fragments of the live demo build: the demo deploys first.
    needs: [check, e2e, hosts, docker, deploy-demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dropletsjs/droplets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare
    permissions:
      contents: read
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:dist
      # A new Worker version takes a moment to answer everywhere, and the
      # pages are built from the demo's answers: wait until it names the build
      # deploy-demo produced (a 404 for a droplet no one has carries it too).
      - name: Wait for the demo to serve the new build
        env:
          DEMO_BUILD: ${{ needs.deploy-demo.outputs.build }}
        run: |
          test -n "$DEMO_BUILD" || { echo "::error::deploy-demo handed over no build hash"; exit 1; }
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            served=$(curl -sS -o /dev/null -D - --max-time 10 "https://demo.dropletsjs.dev/droplets/build-check?t=$SECONDS" \
              | tr -d '\r' | awk -F': ' 'tolower($1) == "x-droplets-build" { print $2 }') || served=""
            if [ "$served" = "$DEMO_BUILD" ]; then echo "The demo serves build $DEMO_BUILD."; exit 0; fi
            echo "The demo serves ${served:-no build yet}; waiting for $DEMO_BUILD."
            sleep 3
          done
          echo "::error::https://demo.dropletsjs.dev did not serve build $DEMO_BUILD within 2 minutes"
          exit 1
      # With DEMO_URL set, nothing of the demo is built or started: the pages
      # fetch their fragments from the deployed demo.
      - run: pnpm docs:build
        env:
          DEMO_URL: https://demo.dropletsjs.dev
      - run: pnpm docs:check-csp
      - run: pnpm --filter @dropletsjs/docs deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
