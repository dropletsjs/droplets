packages:
  - "packages/*"
  - "packages/adapters/*"
  - "packages/renderers/*"
  # The examples one level down; examples/hosts/* stay out on purpose: each
  # host is a standalone project with its own package manager.
  - "examples/*"
  - "examples/frameworks/*"
  - "tests/*"
  - "apps/*"

# The tool ranges every example and test asks for (`"vite": "catalog:"`).
# create-droplets reads the same ranges (packages/create-droplets/versions.ts)
# for the projects it writes.
catalog:
  "@biomejs/biome": 2.6.5
  "@playwright/test": 1.61.1
  "@tailwindcss/vite": ^4.3.4
  "@types/node": ^24.9.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  svelte-check: ^4.7.8
  tailwindcss: ^4.3.4
  # Builds the published packages (packages/shared).
  tsdown: 0.23.5
  typescript: ^5.9.3
  vite: ^8.3.5
  vitest: ^5.1.0
  vue-tsc: ^3.3.14
  wrangler: ^4.157.0

# pnpm's settings (pnpm 10 reads them here, npm never sees them).
# Hoist nothing by default; keep resolution explicit.
shamefullyHoist: false
# The framework resolves its own source files, so link workspace deps.
linkWorkspacePackages: true

# Resolve only versions published at least 7 days ago (minutes).
minimumReleaseAge: 10080

# astro2tsx (astro check) pins @emnapi/core 1.x but takes @emnapi/runtime as a
# peer, which pnpm would fill with the 2.0 beta: the two don't load together.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
