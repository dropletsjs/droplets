# The site: public/ is the document root, so the app's code is never served.
# A path that is not a file there (everything but /shop.css) goes to
# index.php, whatever the method; REQUEST_URI keeps the path and query the
# browser sent.
<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    # %2F in a path reaches Laravel instead of a 404 from Apache.
    AllowEncodedSlashes NoDecode
    # Chunked bodies too, which carry no Content-Length for ValidatePostSize.
    LimitRequestBody 8388608

    <Directory /var/www/app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
