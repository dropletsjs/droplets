# The published ports and the public URLs come from the environment, with
# these defaults: WEB_PORT and WEB_URL (the static page, :8011), DROPLETS_PORT
# and DROPLETS_URL (the shop's droplets server, :8000, which the browser
# reaches directly). tests/hosts/run.mjs sets them for HOSTS_PORT_BASE. The
# ports are published on 127.0.0.1 only.
services:
  # The shop demo, on an origin of its own: the page asks it for fragments
  # cross-origin. Its droplets.config.ts answers the origins listed in
  # DROPLETS_TRUSTED_ORIGINS by name, with credentials.
  shop:
    build:
      context: ../../..
      dockerfile: examples/shop/Dockerfile
    ports:
      - "127.0.0.1:${DROPLETS_PORT:-8000}:8300"
    environment:
      # The demo login; the secrets come from the environment or a .env file here.
      ADMIN_USER: admin
      ADMIN_PASSWORD: droplets
      SHOP_SECRET: ${SHOP_SECRET:?set SHOP_SECRET (32+ random characters) in the environment or a .env file}
      DROPLETS_SECRET: ${DROPLETS_SECRET:?set DROPLETS_SECRET (32+ random bytes) in the environment or a .env file}
      # The page that embeds it: trusted for its posts and redirects, and
      # answered by CORS with credentials (the cart and admin cookies).
      DROPLETS_TRUSTED_ORIGINS: ${WEB_URL:-http://localhost:8011}

  # nginx.conf and html/ baked in (Dockerfile).
  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8011}:80"
    environment:
      DROPLETS_PUBLIC_URL: ${DROPLETS_URL:-http://localhost:8000}
    depends_on:
      - shop
