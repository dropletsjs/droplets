# One static page and its files. nginx proxies nothing: the browser asks
# the shop's droplets server for every droplet itself, on that server's own
# origin (CORS).
#
# A template (the nginx image's /etc/nginx/templates/): DROPLETS_PUBLIC_URL
# comes from the environment at start.

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;

  # The page names its droplets server as http://localhost:8000. When it is
  # published elsewhere (HOSTS_PORT_BASE), the URL is rewritten here.
  sub_filter_types text/html;
  sub_filter_once off;
  sub_filter "http://localhost:8000" "${DROPLETS_PUBLIC_URL}";

  location = / {
    return 302 /gallery;
  }

  # The paths the shop's droplets link to. The same page for each: shop.js
  # reads the path. Only a slug of the shop's shape gets a page.
  location = /gallery {
    try_files /index.html =404;
  }
  location ~ "^/product/[a-z0-9]+(?:-[a-z0-9]+)*$" {
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
