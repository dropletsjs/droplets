# The published ports and the public URLs come from the environment, with
# these defaults: WEB_PORT and WEB_URL (this host), DROPLETS_PORT and
# DROPLETS_URL (the droplets server). tests/hosts/run.mjs sets them for
# HOSTS_PORT_BASE. The ports are published on 127.0.0.1 only.
services:
  droplets:
    build:
      context: ../../..
      dockerfile: examples/frameworks/Dockerfile
    ports:
      - "127.0.0.1:${DROPLETS_PORT:-8000}:8000"
    environment:
      # The URL the host sends as x-droplet-location, and the host's own pages.
      DROPLETS_TRUSTED_ORIGINS: ${DROPLETS_URL:-http://localhost:8000},${WEB_URL:-http://localhost:8007}

  # The shop demo (/gallery). Only the host reaches it: the browser goes
  # through the host's proxy, so the shop's cookies are the host's own.
  shop:
    build:
      context: ../../..
      dockerfile: examples/shop/Dockerfile
    expose:
      - "8300"
    environment:
      # The demo login; the secrets come from the environment or a .env file here.
      ADMIN_USER: admin
      ADMIN_PASSWORD: droplets
      SHOP_SECRET: ${SHOP_SECRET:?set SHOP_SECRET (32+ random characters) in the environment or a .env file}
      # Signs a form result on the redirect back to the page (posts without JavaScript).
      DROPLETS_SECRET: ${DROPLETS_SECRET:?set DROPLETS_SECRET (32+ random bytes) in the environment or a .env file}
      # The host's public origin: the x-droplet-location it sends, its pages' form posts.
      DROPLETS_TRUSTED_ORIGINS: ${WEB_URL:-http://localhost:8007}

  web:
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8007}:8007"
    environment:
      DROPLETS_INTERNAL_URL: http://droplets:8000
      DROPLETS_PUBLIC_URL: ${DROPLETS_URL:-http://localhost:8000}
      SHOP_INTERNAL_URL: http://shop:8300
      SHOP_PUBLIC_URL: ${WEB_URL:-http://localhost:8007}
    depends_on:
      - droplets
      - shop
