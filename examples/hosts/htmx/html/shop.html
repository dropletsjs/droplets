<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The shop's droplets with htmx</title>
  <!-- The same head as index.html: a boosted link swaps only the <body>. -->
  <meta name="htmx-config" content='{"selfRequestsOnly": false}'>
  <script src="/vendor/htmx.min.js"></script>
  <script type="module" src="http://localhost:8000/index.js"></script>
  <script type="module" src="/index.js"></script>
  <script src="/droplet-origins.js"></script>
</head>
<!-- Links and forms go by htmx here, except inside the droplets: each one
     sits in a container with hx-boost="false", so its forms are its own. -->
<body hx-boost="true" style="font-family: system-ui, sans-serif; background: #f8fafc; margin: 0; padding: 2rem;">
  <header style="max-width: 64rem; margin: 0 auto 1rem; display: flex; justify-content: space-between; align-items: center;">
    <nav><a href="/">The Svelte droplets</a></nav>
    <!-- Rendered in the browser: the element, written by the page. -->
    <djs-shop data-droplet="shopping-cart" data-params='{"variant":"badge"}'></djs-shop>
  </header>

  <main style="max-width: 64rem; margin: 0 auto;">
    <h1>The shop's droplets, swapped in by htmx</h1>

    <!-- A form the droplet enhances (data-droplets-enhance): it posts by
         fetch and the droplet renders again in place. -->
    <section id="product" hx-boost="false"
             hx-get="/droplets/product-page?slug=clay-cylinder-mug"
             hx-trigger="load">
      <p>Loading the product…</p>
    </section>

    <!-- A plain form: the post answers 303 back to this page with the
         result in its query, and the fragment asked for on load shows it. -->
    <section id="login" hx-boost="false"
             hx-get="/droplets/login?next=/shop"
             hx-trigger="load">
      <p>Loading the login…</p>
    </section>

    <!-- Asked for only once it scrolls into view; the card then hydrates
         when visible, its own setting. -->
    <div style="height: 120vh;" aria-hidden="true"></div>
    <section id="card" hx-boost="false"
             hx-get="/droplets/product-card?slug=speckled-temple-cup"
             hx-trigger="revealed">
      <p>Scroll down for one more product.</p>
    </section>
  </main>
</body>
</html>
