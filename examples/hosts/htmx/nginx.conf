# A static htmx site. nginx serves the pages and htmx (vendor/), and
# proxies the shop's routes under this origin; the Svelte example's droplets
# server is reached directly by the browser, on its own origin (CORS).
#
# A template (the nginx image's /etc/nginx/templates/): the public URLs
# below come from SHOP_PUBLIC_URL and DROPLETS_PUBLIC_URL at start.

upstream shop {
  server shop:8300;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # The pages are written for the default ports. When the droplets server is
  # published elsewhere (HOSTS_PORT_BASE), its URL in them is rewritten here.
  sub_filter_types text/html;
  sub_filter_once off;
  sub_filter "http://localhost:8000" "${DROPLETS_PUBLIC_URL}";

  location / {
    try_files $uri $uri/ =404;
  }

  location = /shop {
    rewrite ^ /shop.html last;
  }

  # The shop (examples/shop): its entry client, fragments, bundles, form
  # actions and JSON API, passed through as they are (bodies, Set-Cookie,
  # redirects), so its cookies are this origin's own. `x-host` is this
  # site's public URL, written out; the headers a client could use to name
  # another host are cleared. The browser's Referer goes through: the shop
  # reads the page (and a form's result in its query) from it.
  location ~ ^/(index\.js|droplets/|assets/|api/) {
    proxy_pass http://shop;
    proxy_set_header x-host ${SHOP_PUBLIC_URL};
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
  }
}
