# The published ports and the public URLs come from the environment, with
# these defaults: WEB_PORT and WEB_URL (the shop, :8081), DROPLETS_PORT and
# DROPLETS_URL (the basic page, :8080, which proxies the droplets server).
# tests/hosts/run.mjs sets them for HOSTS_PORT_BASE. The ports are published
# on 127.0.0.1 only.
services:
  droplets:
    build:
      context: ../../..
      dockerfile: examples/frameworks/Dockerfile
    expose:
      - "8000"
    environment:
      # Its public URL: nginx's basic page, which proxies it on its own origin.
      DROPLETS_ORIGIN: ${DROPLETS_URL:-http://localhost:8080}
      # Where its host page is: event.host stays within it.
      DROPLETS_TRUSTED_ORIGINS: ${DROPLETS_URL:-http://localhost:8080}

  # The shop demo, served by nginx on :8081. Only nginx reaches it.
  shop:
    build:
      context: ../../..
      dockerfile: examples/shop/Dockerfile
    expose:
      - "8300"
    environment:
      # Demo values from examples/shop/.env.example. Never use them elsewhere.
      ADMIN_USER: admin
      ADMIN_PASSWORD: droplets
      SHOP_SECRET: demo-only-secret-change-me-0123456789abcdef
      # Signs a form result on the redirect back to the page (posts without JavaScript).
      DROPLETS_SECRET: demo-only-droplets-secret-change-me-0123456789
      # Its public URL: nginx's shop origin, where its pages and form posts are.
      DROPLETS_ORIGIN: ${WEB_URL:-http://localhost:8081}
      # Where its host pages are: event.host stays within it.
      DROPLETS_TRUSTED_ORIGINS: ${WEB_URL:-http://localhost:8081}

  # nginx.conf, html/ and shop/ baked in (Dockerfile). nginx.conf is a
  # template, with the shop's public URL below filled in at start.
  web:
    build: .
    ports:
      - "127.0.0.1:${DROPLETS_PORT:-8080}:80"
      - "127.0.0.1:${WEB_PORT:-8081}:8081"
    environment:
      SHOP_PUBLIC_URL: ${WEB_URL:-http://localhost:8081}
    depends_on:
      - droplets
      - shop
