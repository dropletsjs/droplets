# Droplets behind nginx: the page is a static file with Server Side Includes,
# and every droplets route is proxied under this server's own origin. The
# browser never talks to the droplets server directly, so no CORS is needed.
#
# A template (the nginx image's /etc/nginx/templates/): the public URLs
# below come from DROPLETS_PUBLIC_URL and SHOP_PUBLIC_URL at start.

upstream droplets {
  server droplets:8000;
}

upstream shop {
  server shop:8300;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static pages with <!--# include virtual="/droplets/<id>" --> directives.
  location / {
    ssi on;
    try_files $uri $uri/ =404;
  }

  # Everything the droplets server owns: the entry client, the droplet routes
  # (fragments, bundles, styles, _data), the shared assets and its /api
  # endpoints. `x-host` tells it which origin the browser will use, so the
  # fragment points back here rather than upstream. It is this site's public
  # URL, written out: never the request's Host header, which the client sends.
  location ~ ^/(index\.js|droplets/|assets/|api/) {
    proxy_pass http://droplets;
    proxy_set_header x-host ${DROPLETS_PUBLIC_URL};
  }
}

# The product page's `v` (its version, from the link), as the fragment's
# query takes it, and the page's own query without it.
map $arg_v $shop_page_v {
  "" "";
  default "&v=$arg_v";
}
map $args $shop_args_without_v {
  "~^v=[^&]*&?(?<rest>.*)$" $rest;
  "~^(?<head>.*?)&v=[^&]*(?<tail>.*)$" $head$tail;
  default $args;
}
map $shop_args_without_v $shop_query_without_v {
  "" "";
  default "?$shop_args_without_v";
}

# The shop demo (examples/shop), on an origin of its own: its /index.js,
# /droplets/*, /assets/* and /api/* would collide with the basic server's
# above. Same two tools: SSI composes the pages, the proxy carries the rest,
# so the shop's cookies (cart, admin session) are this origin's own.
server {
  listen 8081;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/shop;
  # Room for the product's `_data` read, kept in an SSI variable.
  subrequest_output_buffer_size 64k;

  # The pages. Each is an .html file of SSI directives, served only here.
  location = / {
    return 302 /gallery;
  }
  location = /gallery {
    ssi on;
    rewrite ^ /gallery.html break;
  }
  # product.html reads the product's id, name and category from the
  # product page's public `_data` read ($slug, from this pattern), picked out
  # of its JSON with an SSI `if` and named captures.
  #
  # `v`, when the link had one, goes to the product page: the shop serves its
  # build's page for the current version and redirects an old one. SSI cannot
  # pass a redirect on, so the check below asks first, and an old `v` gets a
  # 302 to this URL without it, from here.
  location ~ "^/product/(?<slug>[a-z0-9]+(?:-[a-z0-9]+)*)$" {
    ssi on;
    # Set in this request: its subrequests and product.html share them.
    set $page_v $shop_page_v;
    set $page_without_v /product/$slug$shop_query_without_v;
    # An unknown product is a 404, an old `v` a redirect: the fragment, asked first.
    auth_request /_product-check;
    error_page 401 =404 /not-found.html;
    error_page 403 = @old-version;
    rewrite ^ /product.html break;
  }
  location = /not-found.html {
    internal;
    ssi on;
  }
  location = /_product-check {
    internal;
    proxy_pass http://shop/droplets/product-page?slug=$slug$page_v;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie "";
    proxy_set_header x-host ${SHOP_PUBLIC_URL};
    proxy_set_header Accept text/html;
    proxy_intercept_errors on;
    error_page 404 = @missing;
    error_page 301 302 303 307 308 = @moved;
  }
  location @missing {
    return 401;
  }
  location @moved {
    return 403;
  }
  location @old-version {
    return 302 $page_without_v;
  }
  location = /login {
    ssi on;
    rewrite ^ /login.html break;
  }
  location = /admin {
    ssi on;
    rewrite ^ /admin.html break;
  }
  location = /shop.css {
  }
  # The header and footer every page includes.
  location ^~ /_layout/ {
    internal;
    ssi on;
  }
  location / {
    return 404;
  }

  # What the browser asks the shop for: fragments, bundles, form actions,
  # the JSON API. Passed through as they are (bodies, Set-Cookie, redirects);
  # `x-host` is this server's public URL, written out, and the headers a
  # client could use to name another host are cleared.
  location ~ ^/(index\.js|droplets/|assets/|api/) {
    proxy_pass http://shop;
    proxy_set_header x-host ${SHOP_PUBLIC_URL};
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    # Admin uploads: an image of up to 2 MB in a 3 MB form.
    client_max_body_size 4m;
  }

  # The fragments the pages include. A subrequest carries the browser's
  # Cookie; Referer is the page itself ($request_uri is the page's in a
  # subrequest), so the shop knows where the droplet renders.
  location ^~ /_fragment/ {
    internal;
    rewrite ^/_fragment(/.*)$ $1 break;
    proxy_pass http://shop;
    proxy_set_header x-host ${SHOP_PUBLIC_URL};
    proxy_set_header Referer ${SHOP_PUBLIC_URL}$request_uri;
    proxy_set_header Accept text/html;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    # Only a fragment goes into the page (a 500 is the droplet's error page):
    # other errors are text that may echo the query, so a note replaces them.
    proxy_intercept_errors on;
    error_page 400 401 403 404 405 413 431 502 503 504 = @unavailable;
  }
  location @unavailable {
    default_type text/html;
    return 200 '<p class="shop-unavailable">This droplet is unavailable.</p>';
  }
}
