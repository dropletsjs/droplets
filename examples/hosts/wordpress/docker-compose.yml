# The published ports and the public URLs come from the environment, with
# these defaults: WEB_PORT and WEB_URL (this host), DROPLETS_PORT and
# DROPLETS_URL (the droplets server). tests/hosts/run.mjs sets them for
# HOSTS_PORT_BASE. The ports are published on 127.0.0.1 only.
services:
  droplets:
    build:
      context: ../../..
      dockerfile: examples/frameworks/Dockerfile
    ports:
      - "127.0.0.1:${DROPLETS_PORT:-8000}:8000"
    environment:
      # The URL the host sends as x-droplet-location, and the host's own pages.
      DROPLETS_TRUSTED_ORIGINS: ${DROPLETS_URL:-http://localhost:8000},${WEB_URL:-http://localhost:8008}

  # The shop (examples/wp-shop): the shop's droplets, backed by this
  # WordPress. Only WordPress reaches it: the browser goes through the
  # plugin's proxy, so its cart cookie is the site's own. It waits for
  # WordPress's REST API, builds (prerendering from it), then serves.
  wp-shop:
    build:
      context: ../../..
      dockerfile: examples/wp-shop/Dockerfile
    expose:
      - "8310"
    environment:
      WP_INTERNAL_URL: http://wordpress
      WP_PUBLIC_URL: ${WEB_URL:-http://localhost:8008}
      # Demo values. Never use them elsewhere. The same two secrets as
      # WordPress's, one per direction, never equal: the host secret checks
      # x-wp-shop-user, the service secret signs wp-shop's writes back.
      WP_SHOP_HOST_SECRET: demo-only-host-secret-change-me-0123456789abcdef
      WP_SHOP_SERVICE_SECRET: demo-only-service-secret-change-me-0123456789ab
      # Signs a form result on the redirect back to the page (posts without JavaScript).
      DROPLETS_SECRET: demo-only-droplets-secret-change-me-0123456789
      # The site's public origin: the x-droplet-location it sends, its pages' form posts.
      DROPLETS_TRUSTED_ORIGINS: ${WEB_URL:-http://localhost:8008}
    depends_on:
      - wordpress

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql

  # WordPress with the plugin (plugin/droplets-embed) baked in (Dockerfile).
  wordpress:
    build:
      context: .
      target: wordpress
    ports:
      - "127.0.0.1:${WEB_PORT:-8008}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      DROPLETS_INTERNAL_URL: http://droplets:8000
      DROPLETS_PUBLIC_URL: ${DROPLETS_URL:-http://localhost:8000}
      SHOP_INTERNAL_URL: http://wp-shop:8310
      SHOP_PUBLIC_URL: ${WEB_URL:-http://localhost:8008}
      # Signs x-wp-shop-user for a logged-in admin (WordPress → wp-shop).
      WP_SHOP_HOST_SECRET: demo-only-host-secret-change-me-0123456789abcdef
      # Checks wp-shop's writes back (x-wp-shop-service, wp-shop → WordPress),
      # on the product write route only. Demo values; 32+ bytes each, never equal.
      WP_SHOP_SERVICE_SECRET: demo-only-service-secret-change-me-0123456789ab
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - db
      - droplets

  # Builds the site with WP-CLI once the database is up (site/init.sh): the
  # stock theme, the shop's catalogue (examples/shop's mock data, imported as
  # posts, media and comments), the pages and posts, the menu, the header and
  # footer, then the plugin. No wizard is left to click through. Demo values
  # only: admin / droplets. It runs as www-data of the Debian-based image
  # (uid 33), so the files it writes stay the site's; then it exits. site/
  # and the shop's data and images are baked in (Dockerfile).
  wordpress-init:
    build:
      context: .
      target: init
      additional_contexts:
        shop: ../../shop
    user: "33:33"
    environment:
      HOME: /tmp
      # The site's URL, as WordPress installs it.
      WP_PUBLIC_URL: ${WEB_URL:-http://localhost:8008}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress:/var/www/html
    command: ["sh", "/site/init.sh"]
    depends_on:
      - db
      - wordpress

volumes:
  db:
  wordpress:
