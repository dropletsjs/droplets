# The published ports and the public URLs come from the environment, with
# these defaults: WEB_PORT and WEB_URL (this host), DROPLETS_PORT and
# DROPLETS_URL (the droplets server). tests/hosts/run.mjs sets them for
# HOSTS_PORT_BASE. The ports are published on 127.0.0.1 only.
services:
  droplets:
    build:
      context: ../../..
      dockerfile: examples/frameworks/Dockerfile
    ports:
      - "127.0.0.1:${DROPLETS_PORT:-8000}:8000"
    environment:
      # The URL the host sends as x-host, and the host's own pages.
      DROPLETS_TRUSTED_ORIGINS: ${DROPLETS_URL:-http://localhost:8000},${WEB_URL:-http://localhost:8004}

  # The shop demo (/gallery). Only the app's nginx reaches it: the browser
  # goes through its proxy, so the shop's cookies are the app's own.
  shop:
    build:
      context: ../../..
      dockerfile: examples/shop/Dockerfile
    expose:
      - "8300"
    environment:
      # Demo values from examples/shop/.env.example. Never use them elsewhere.
      ADMIN_USER: admin
      ADMIN_PASSWORD: droplets
      SHOP_SECRET: demo-only-secret-change-me-0123456789abcdef
      # Signs a form result on the redirect back to the page (posts without JavaScript).
      DROPLETS_SECRET: demo-only-droplets-secret-change-me-0123456789
      # The app's public origin: the x-host its nginx sends, its form posts.
      DROPLETS_TRUSTED_ORIGINS: ${WEB_URL:-http://localhost:8004}

  web:
    build:
      context: .
      args:
        VITE_DROPLETS_URL: ${DROPLETS_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-8004}:80"
    environment:
      # The x-host its nginx sends (nginx.conf, a template).
      SHOP_PUBLIC_URL: ${WEB_URL:-http://localhost:8004}
    depends_on:
      - droplets
      - shop
