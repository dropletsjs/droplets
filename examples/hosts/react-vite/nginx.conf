# The image's nginx: serves the built app, and proxies the shop demo under
# this origin so its cookies are first-party and nothing is cross-origin.
# A template (the nginx image's /etc/nginx/templates/): the public URL
# below comes from SHOP_PUBLIC_URL at start.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # What the browser asks the shop for. `x-host` is this app's public URL,
  # written out: never the request's Host header, which the client sends.
  # Headers that would name another host are cleared.
  location ~ ^/(index\.js$|droplets/|assets/|api/) {
    proxy_pass http://shop:8300;
    proxy_set_header x-host ${SHOP_PUBLIC_URL};
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-For "";
    # Admin product images are up to 2 MB.
    client_max_body_size 4m;
  }

  # The single-page app answers every other route: `/` (the Svelte example),
  # `/gallery`, `/product/:slug`, `/login`, `/admin`.
  location / {
    try_files $uri /index.html;
  }
}
