# The image's nginx: serves the built app, and proxies the shop demo under
# this origin so its cookies are first-party and nothing is cross-origin.
# A template (the nginx image's /etc/nginx/templates/): the public URL
# below comes from SHOP_PUBLIC_URL at start.

# The shop's own cookies, the only ones it is sent: another app's on this
# origin stay here. A cookie value holds no space, so one separates the two.
map "$cookie_cart_id $cookie_shop_admin" $shop_cookie {
  default "";
  "~^(?<cart>\S+) $" "cart_id=$cart";
  "~^ (?<admin>\S+)$" "shop_admin=$admin";
  "~^(?<cart>\S+) (?<admin>\S+)$" "cart_id=$cart; shop_admin=$admin";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # What the browser asks the shop for. `x-droplet-location` is this app's
  # public URL, written out: never the request's Host header, which the
  # client sends. Forwarded headers that would name another host are cleared:
  # the shop reads them only as a fallback for its location, and trusts them
  # only against its allow-list.
  location ~ ^/(index\.js$|env\.js$|index\.css$|droplets/|assets/|api/) {
    proxy_pass http://shop:8300;
    proxy_set_header Cookie $shop_cookie;
    proxy_set_header x-droplet-location ${SHOP_PUBLIC_URL};
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header X-Forwarded-For "";
    # Admin product images are up to 2 MB.
    client_max_body_size 4m;
  }

  # The single-page app answers every other route: `/` (the Svelte example),
  # `/gallery`, `/product/:slug`, `/login`, `/admin`.
  location / {
    try_files $uri /index.html;
  }
}
