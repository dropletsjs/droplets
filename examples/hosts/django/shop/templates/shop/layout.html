<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Droplets Shop on {{ stack }}</title>
<link rel="stylesheet" href="/shop.css">
{% for link in links %}<link rel="{{ link.rel }}" href="{{ link.href }}"{% if link.kind %} as="{{ link.kind }}"{% endif %}>
{% endfor %}<script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/product/*"},"eagerness":"moderate"}]}</script>
<script type="module" src="/index.js"></script>
</head>
<body class="shop">
{{ toasts }}
<header class="shop-header"><div class="shop-wrap">
<a class="shop-logo" href="/gallery"><span aria-hidden="true">◆</span> Droplets Shop</a>
<nav class="shop-nav" aria-label="Shop"><a href="/gallery"{% if current == "/gallery" %} aria-current="page"{% endif %}>Gallery</a><a href="/admin"{% if current == "/admin" %} aria-current="page"{% endif %}>Admin</a></nav>
<div class="shop-cart">{{ cart }}</div>
</div></header>
<main class="shop-main shop-wrap">
{% block main %}{% endblock %}
</main>
<footer class="shop-footer"><div class="shop-wrap">
<p class="shop-stack">{{ stack }}</p>
<p>Droplets demo shop · host: {{ stack }} · droplets: &lt;djs-shop&gt;</p>
<p><a href="/gallery">Gallery</a> · <a href="/admin">Admin</a> · <a href="/">The Svelte example</a></p>
</div></footer>
</body>
</html>
