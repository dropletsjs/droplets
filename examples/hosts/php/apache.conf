# The site: public/ is the document root, so app/ is never served. A path
# that is not a file there (everything but /shop.css) goes to index.php,
# whatever the method; REQUEST_URI keeps the path and query the browser sent.
<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    # %2F in a path reaches PHP instead of a 404 from Apache.
    AllowEncodedSlashes NoDecode

    <Directory /var/www/app/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
