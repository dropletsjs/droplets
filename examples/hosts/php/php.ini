; The host only proxies request bodies, it never reads a form itself. With
; this off, PHP leaves every body in php://input, multipart included (the
; admin's image upload), instead of parsing it into $_POST and $_FILES and
; leaving php://input empty. $_GET is still filled.
enable_post_data_reading = Off

; Errors go to the log (`docker compose logs web`), never into a page.
display_errors = Off
log_errors = On
expose_php = Off
