server.port=8016
spring.main.banner-mode=off
spring.threads.virtual.enabled=true

# The proxy passes request bodies on as they came: nothing may read a form
# first (multipart, or a PUT/PATCH/DELETE form body).
spring.servlet.multipart.enabled=false
spring.mvc.formcontent.filter.enabled=false

# The shop's x-droplet-props is at most 8 KB; the rest of the headers fit beside it.
server.max-http-request-header-size=32KB
